[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "pnpm dev"
  port = 8888
  targetPort = 3000

[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"

# Share links are bearer credentials in the URL path, so keep them out of search
# results and out of the Referer header of every outbound link a reader clicks.
[[headers]]
  for = "/s/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
